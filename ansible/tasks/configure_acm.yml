---
- name: create a certificate
  community.aws.acm_certificate:
    certificate: "{{ lookup('file', 'ca_cert.crt' ) }}"
    private_key: "{{ lookup('file', 'key.pem' ) }}"
    name_tag: aws_cert
    state: present
  register: cert_create

- name: Output ACM Certificate ARN
  debug:
    msg: "ACM Certificate ARN: {{ acm_cert.certificate_arn }}"
